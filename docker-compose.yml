services:
  backend:
    build: ./backend
    image: chris85618/hevy-bridge-backend:latest
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=/data/fitir.db
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"   # direct API access (frontend/backend are separable)
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: chris85618/hevy-bridge-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
